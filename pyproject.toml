[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-assistant-rag"
version = "0.1.0"
description = "Local, project-scoped document ingestion and hybrid retrieval subsystem for AI-Team (v2 spec)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "numpy>=1.26,<3",
    "pypdf>=4.2,<6",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
# v3 extras (spec A03 §15.2): `serve` = production service image (filled from S6 onward; torch
# never enters it), `dev` = tests + toolchain (CI), `dev-gpu` = local reference/heavy backends
# (torch Qwen3 embedder, cross-encoder reranker, docling, chroma) run in the WSL ROCm venv.
serve = []
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff==0.8.6",
    "pyright==1.1.391",
    "import-linter>=2.1,<3",
    "hypothesis>=6.100,<7",
    "respx>=0.21,<1",
    "httpx>=0.27,<1",
    # stdio MCP server (project_rag.mcp_server) — light; lets its unit test run in CI.
    "mcp>=1.2",
]
dev-gpu = [
    # A01 dense reference: Qwen3-Embedding-4B (needs transformers>=4.51 per model card).
    "sentence-transformers>=3,<4",
    "transformers>=4.51",
    "torch>=2.1",
    "chromadb>=0.5,<2",
    "docling>=2,<3",
    "mcp>=1.2",
]

[project.scripts]
project-rag = "project_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: needs a pinned local model server or GPU venv; never run in CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["local_data", "yspdb", "holdout-report", "eval/results"]

[tool.ruff.lint]
# Pinned explicitly so CI and every machine lint identically (no reliance on ambient config).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "C4"]
# E501: the formatter owns line length (long string literals are left alone by design).
# RUF001-003: the corpus and its tests are Bulgarian; Cyrillic letters are intentional, not confusables.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]


[tool.pyright]
# S0: basic mode over src/ with the recorded baseline (build plan §5). S1 turns on strict per
# package (domain, core, ports, services, wiring) via `strict = [...]`.
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
