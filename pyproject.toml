[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-assistant-rag"
version = "0.1.0"
description = "Local, project-scoped document ingestion and hybrid retrieval subsystem for AI-Team (v2 spec)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "numpy>=1.26,<3",
    "pypdf>=4.2,<6",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    # D-3 candidate vector index: one SQLite file with the catalog and FTS5 (S2 spike).
    "sqlite-vec==0.1.9",
    # HTTP model providers (S3): one client for /v1/embeddings, /v1/rerank, /tokenize.
    "httpx>=0.27,<1",
    "tenacity>=8.2,<10",
]

[project.optional-dependencies]
# v3 extras (spec A03 §15.2): `serve` = production service image (filled from S6 onward; torch
# never enters it), `dev` = tests + toolchain (CI), `dev-gpu` = local reference/heavy backends
# (torch Qwen3 embedder, cross-encoder reranker, docling, chroma) run in the WSL ROCm venv.
serve = [
    # D-3 (S2): Chroma is the vector store. The stdio/HTTP MCP interface (S6) needs `mcp`.
    "chromadb>=0.5,<2",
    "mcp>=2.3,<3",
    # S6 service: ASGI app (admin API, /healthz, /metrics) with the MCP Streamable HTTP app mounted.
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "prometheus-client>=0.20,<1",
    # Tier-S smoke question writer (D-7 owner key; S7). Used only when the key is configured.
    "anthropic>=1,<2",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff==0.8.6",
    "pyright==1.1.391",
    "import-linter>=2.1,<3",
    "hypothesis>=6.100,<7",
    "respx>=0.21,<1",
    # MCP server/client + the S6 service stack, so their tests run in CI.
    "mcp>=2.3,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "prometheus-client>=0.20,<1",
]
dev-gpu = [
    # A01 dense reference: Qwen3-Embedding-4B (needs transformers>=4.51 per model card).
    "sentence-transformers>=3,<4",
    "transformers>=4.51",
    "torch>=2.1",
    "chromadb>=0.5,<2",
    "docling>=2,<3",
    "mcp>=1.2",
]

[project.scripts]
project-rag = "project_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"project_rag.adapters.sqlite" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: needs a pinned local model server or GPU venv; never run in CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["local_data", "yspdb", "holdout-report", "eval/results"]

[tool.ruff.lint]
# Pinned explicitly so CI and every machine lint identically (no reliance on ambient config).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "C4"]
# E501: the formatter owns line length (long string literals are left alone by design).
# RUF001-003: the corpus and its tests are Bulgarian; Cyrillic letters are intentional, not confusables.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]


[tool.pyright]
# Basic mode over src/; strict on the layers the spec requires (A03 §15.3 R9). Adapters and the
# interfaces stay basic: they sit on untyped third-party edges.
include = ["src"]
strict = [
    "src/project_rag/domain",
    "src/project_rag/core",
    "src/project_rag/ports",
    "src/project_rag/services",
    "src/project_rag/wiring.py",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

# Layer rules (spec A03 §15.3 R1, R2, R5, R7), enforced by `uv run lint-imports`.
[tool.importlinter]
root_package = "project_rag"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "R1 domain imports nothing from the package"
type = "forbidden"
source_modules = ["project_rag.domain"]
forbidden_modules = [
    "project_rag.core", "project_rag.ports", "project_rag.adapters", "project_rag.services",
    "project_rag.interfaces", "project_rag.wiring", "project_rag.api",
]

[[tool.importlinter.contracts]]
name = "R1 core and ports import only the domain"
type = "forbidden"
source_modules = ["project_rag.core", "project_rag.ports"]
forbidden_modules = [
    "project_rag.adapters", "project_rag.services", "project_rag.interfaces",
    "project_rag.wiring", "project_rag.api",
]

[[tool.importlinter.contracts]]
name = "R1 core and ports are independent"
type = "independence"
modules = ["project_rag.core", "project_rag.ports"]

[[tool.importlinter.contracts]]
name = "R1 services and interfaces never reach adapters (even indirectly)"
type = "forbidden"
source_modules = ["project_rag.services", "project_rag.interfaces"]
forbidden_modules = ["project_rag.adapters"]

[[tool.importlinter.contracts]]
name = "R1 entry modules reach adapters only through wiring"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["project_rag.api", "project_rag.cli", "project_rag.mcp_server"]
forbidden_modules = ["project_rag.adapters"]

[[tool.importlinter.contracts]]
name = "R1 services never import interfaces or the composition root"
type = "forbidden"
source_modules = ["project_rag.services"]
forbidden_modules = ["project_rag.interfaces", "project_rag.wiring", "project_rag.api"]

[[tool.importlinter.contracts]]
name = "R1 interfaces never import the composition root"
type = "forbidden"
source_modules = ["project_rag.interfaces"]
forbidden_modules = ["project_rag.wiring", "project_rag.api"]

[[tool.importlinter.contracts]]
name = "R1 adapters never import services, interfaces or wiring"
type = "forbidden"
source_modules = ["project_rag.adapters"]
forbidden_modules = [
    "project_rag.services", "project_rag.interfaces", "project_rag.wiring", "project_rag.api",
]

[[tool.importlinter.contracts]]
name = "R2 third-party libraries only in adapters (mcp also in interfaces.mcp)"
type = "forbidden"
allow_indirect_imports = true  # direct imports only: layering is covered by the R1 contracts
source_modules = [
    "project_rag.domain", "project_rag.core", "project_rag.ports", "project_rag.services",
    "project_rag.interfaces.cli", "project_rag.interfaces.api_protocol", "project_rag.wiring",
    "project_rag.api", "project_rag.cli",
]
forbidden_modules = [
    "yaml", "torch", "sentence_transformers", "transformers", "chromadb", "docx", "openpyxl",
    "pypdf", "docling", "mcp", "httpx", "tenacity", "fastapi", "prometheus_client",
]

[[tool.importlinter.contracts]]
name = "R5/R7 no hidden I/O, clock, logging or environment in the core"
type = "forbidden"
allow_indirect_imports = true  # direct imports only: layering is covered by the R1 contracts
source_modules = ["project_rag.core", "project_rag.domain", "project_rag.ports"]
forbidden_modules = [
    "os", "time", "logging", "pathlib", "sqlite3", "socket", "subprocess", "shutil",
    "tempfile", "random",
]

[[tool.importlinter.contracts]]
name = "R7 nothing below wiring reads the environment"
type = "forbidden"
allow_indirect_imports = true  # direct imports only: layering is covered by the R1 contracts
source_modules = ["project_rag.services", "project_rag.interfaces"]
forbidden_modules = ["os"]
