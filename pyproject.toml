[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-assistant-rag"
version = "0.1.0"
description = "Local, project-scoped document ingestion and hybrid retrieval subsystem for AI-Team (v2 spec)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "numpy>=1.26,<3",
    "pypdf>=4.2,<6",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
# Heavy production backends — installed only when validated on the real corpus.
# A01 production dense candidate: Qwen3-Embedding-4B (needs transformers>=4.51 per model card).
qwen3 = [
    "sentence-transformers>=3,<4",
    "transformers>=4.51",
    "torch>=2.1",
]
e5 = ["sentence-transformers>=3,<4"]        # legacy comparator (A01 supersedes as default)
# Cross-encoder reranker (spec v1 §7), enabled via retrieval.rerank. Reuses sentence-transformers.
rerank = ["sentence-transformers>=3,<4"]
chroma = ["chromadb>=0.5,<2"]
docling = ["docling>=2,<3"]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
]

[project.scripts]
project-rag = "project_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
