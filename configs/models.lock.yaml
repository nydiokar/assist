# Pinned model artifacts and server image (v3 build plan S3; spec A03 §6.1/§6.2).
# sha256 = the Hugging Face LFS object id of the file at the pinned revision (checked 2026-11-11
# via https://huggingface.co/api/models/<repo>/tree/main). `scripts/fetch_models.py` (make models)
# downloads into models_dir and refuses any file whose sha256 differs. The service refuses to
# start on a missing or mismatched GGUF (S8).
