# Real-corpus dense run: yp_qwen06. See docs/AMENDMENT_A02.md for why this is CPU, not CUDA.
schema_version: 1

embedding:
  provider: qwen3
  threads: 16
  qwen3:
    model: "Qwen/Qwen3-Embedding-0.6B"
    revision: "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3"
    dim: 1024
    normalize: true
    vector_storage_dtype: float32
    inference_dtype: bfloat16
    device: cpu
    max_input_tokens: 2048
    query_prompt_name: query
    query_prompt_version: qwen3_query_v1
    tokenizer_padding_side: left
    batch_size: 4

parsing: {backend: native, detect_scanned_pdf: true}

vector_store:
  provider: chroma
  collection: "yp_qwen06"
  distance: cosine
  persist_path: "local_data/yp_qwen06/chroma"

lexical_store:
  path: "local_data/yp_qwen06/manifest.sqlite3"

chunking: {target_tokens: 500, max_tokens: 2048, overlap_tokens: 0, table_rows_per_chunk: 20}

retrieval:
  top_k: 8
  candidates_per_channel: 16
  fusion: {method: rrf, k: 60}
  max_source_chars: 6000

security: {max_query_chars: 2000, max_result_excerpt_chars: 4000}

classification:
  reference_prefixes: ["Youth Participation Resources/"]
