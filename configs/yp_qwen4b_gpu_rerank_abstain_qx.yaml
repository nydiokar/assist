# Round-2 Task B: reranked+abstain eval pipeline WITH cross-language query expansion (F11/F14).
# Identical to yp_qwen4b_gpu_rerank_abstain.yaml except retrieval.query_expansion.enabled: true.
# Keep both so the before/after is a one-line diff. Query-time only, no reindex.
schema_version: 1

embedding:
  provider: qwen3
  threads: 8
  qwen3:
    model: "Qwen/Qwen3-Embedding-4B"
    revision: "5cf2132abc99cad020ac570b19d031efec650f2b"
    dim: 2560
    normalize: true
    vector_storage_dtype: float32
    inference_dtype: bfloat16
    device: cuda
    max_input_tokens: 2048
    query_prompt_name: query
    query_prompt_version: qwen3_query_v1
    tokenizer_padding_side: left
    batch_size: 16

parsing: {backend: native, detect_scanned_pdf: true}

vector_store:
  provider: chroma
  collection: "yp_qwen4b_gpu"
  distance: cosine
  persist_path: "local_data/yp_qwen4b_gpu/chroma"

lexical_store:
  path: "local_data/yp_qwen4b_gpu/manifest.sqlite3"

chunking:
  target_tokens: 500
  max_tokens: 2048
  overlap_tokens: 0
  table_rows_per_chunk: 20

retrieval:
  top_k: 8
  candidates_per_channel: 16
  fusion: {method: rrf, k: 60}
  per_file_cap: 3
  max_source_chars: 6000
  rerank:
    enabled: true
    model: "BAAI/bge-reranker-v2-m3"
    revision: "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"
    device: cuda
    top_n: 12
    batch_size: 16
    max_length: 512
  abstention:
    enabled: true
    signal: rerank_score
    min_top_score: 0.26
    suppress_on_insufficient: false   # eval: keep passages, record verdict
  query_expansion:
    enabled: true
    corpus_script: cyrillic           # yspdb is Bulgarian-dominant

security: {max_query_chars: 2000, max_result_excerpt_chars: 4000}

classification:
  reference_prefixes: ["Youth Participation Resources/"]
