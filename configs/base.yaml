# Production base config, baked into the assist image (spec §6.7). Per-host values come from
# /config/deployment.yaml (overlay) and secrets from the environment. Container paths only.
# D-1 (quant) is pending E1: Q8_0 until the owner decides.

embedding:
  provider: openai_compat
  openai_compat:
    base_url: http://embed:8080
    model_id: Qwen/Qwen3-Embedding-4B-GGUF
    revision: f4602530db1d980e16da9d7d3a70294cf5c190be
    gguf_file: Qwen3-Embedding-4B-Q8_0.gguf
    gguf_sha256: b60ae5ce2dd6a0b77f82cadf21def1f310a3e10cde380ad0081b07a9d416949d
    quant: Q8_0
    dim: 2560
    pooling: last
    query_prompt_version: qwen3_query_v1
    max_input_tokens: 2048
    max_batch: 16
    timeout_s: 300

parsing:
  backend: native
  detect_scanned_pdf: true
  antiword: true
  ocr:
    enabled: true
    languages: bul+eng
    min_chars: 15          # tuned on the YP OCR survey (DECISIONS 2026-11-11)
    min_mean_conf: 65.0    # tuned on the YP OCR survey (DECISIONS 2026-11-11)

vector_store:
  provider: chroma
  collection: assist_q8_0_v1
  distance: cosine
  persist_path: /state/chroma

lexical_store:
  path: /state/store.sqlite3

chunking:
  target_tokens: 500
  max_tokens: 2048
  overlap_tokens: 0
  table_rows_per_chunk: 20

retrieval:
  top_k: 8
  candidates_per_channel: 16
  fusion: {method: rrf, k: 60}
  per_file_cap: 3
  max_source_chars: 6000
  rerank:
    enabled: true
    provider: openai_compat
    top_n: 12
    openai_compat:
      base_url: http://rerank:8080
      gguf_file: bge-reranker-v2-m3-Q8_0.gguf
      gguf_sha256: a43c7c9b11a4c1517e5bf95151960e1621d1b72f7a493364b01e386cf1aaa1d3
      score_transform: sigmoid
  abstention:
    enabled: true
    signal: rerank_score
    min_top_score: 0.26
    suppress_on_insufficient: true

security: {max_query_chars: 2000, max_result_excerpt_chars: 1200}

classification:
  reference_prefixes: ["Youth Participation Resources/"]

service:
  corpus_root: /corpus
  models_dir: /models
