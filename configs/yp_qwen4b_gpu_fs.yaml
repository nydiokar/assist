# Filesystem-presence experiment (Task 3, 2026-10-28). SEPARATE index location from the frozen
# yp_qwen4b_gpu so the canonical index is never clobbered. Same embedder/chunking/retrieval as the
# reranked pipeline; adds classification.filesystem_evidence and the reranker+abstention gate so
# the measurement is on the production-shaped pipeline. Content chunks are identical text to the
# frozen index -> the embedding cache is reused; only the ~37 filesystem chunks embed fresh.
schema_version: 1

embedding:
  provider: qwen3
  threads: 8
  qwen3:
    model: "Qwen/Qwen3-Embedding-4B"
    revision: "5cf2132abc99cad020ac570b19d031efec650f2b"
    dim: 2560
    normalize: true
    vector_storage_dtype: float32
    inference_dtype: bfloat16
    device: cuda
    max_input_tokens: 2048
    query_prompt_name: query
    query_prompt_version: qwen3_query_v1
    tokenizer_padding_side: left
    batch_size: 16

parsing: {backend: native, detect_scanned_pdf: true}

vector_store:
  provider: chroma
  collection: "yp_qwen4b_gpu_fs"
  distance: cosine
  persist_path: "local_data/yp_qwen4b_gpu_fs/chroma"

lexical_store:
  path: "local_data/yp_qwen4b_gpu_fs/manifest.sqlite3"

chunking:
  target_tokens: 500
  max_tokens: 2048
  overlap_tokens: 0
  table_rows_per_chunk: 20

retrieval:
  top_k: 8
  candidates_per_channel: 16
  fusion: {method: rrf, k: 60}
  per_file_cap: 3
  max_source_chars: 6000
  rerank:
    enabled: true
    model: "BAAI/bge-reranker-v2-m3"
    revision: "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"
    device: cuda
    top_n: 12
    batch_size: 16
    max_length: 512
  abstention:
    enabled: true
    signal: rerank_score
    min_top_score: 0.26
    suppress_on_insufficient: false

security: {max_query_chars: 2000, max_result_excerpt_chars: 4000}

classification:
  reference_prefixes: ["Youth Participation Resources/"]
  filesystem_evidence: true
