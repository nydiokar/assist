# Report-drafting profile (WP4 demo, 2026-10-29). Identical index to yp_qwen4b_gpu (query-time
# only, no reindex) — same collection/manifest/persist_path. Differs from yp_qwen4b_gpu_rerank.yaml
# in ONE way: the abstention gate keeps passages (suppress_on_insufficient: false) so the grounded
# answerer (scripts/answer.py) sees the retrieved context and makes the abstain/ground call itself.
#
# Why (measured, F20 2026-10-29): report-drafting queries are diffuse ("what evidence for section
# X") and legitimately score 0.05-0.17 on the cross-encoder even when the right document is rank-1
# (rp07/08/11/12). The 0.26 threshold — tuned on pinpoint factual questions (F16) — FALSELY abstains
# them, the owner's exact false-negative worry. The honest division of labor (DECISIONS 2026-10-28,
# F16 note): the retrieval gate catches topic-plausible/evidence-irrelevant negatives cheaply, but
# the final ground-or-abstain judgment on diffuse report queries belongs to the LLM, which is strong
# at exactly that (the whole point of the hosted-Claude egress decision). So: verdict still COMPUTED
# and handed to the answerer as a signal, but passages are NOT suppressed — the answerer grounds on
# them or says "Not established…" per its system prompt.
schema_version: 1

embedding:
  provider: qwen3
  threads: 8
  qwen3:
    model: "Qwen/Qwen3-Embedding-4B"
    revision: "5cf2132abc99cad020ac570b19d031efec650f2b"
    dim: 2560
    normalize: true
    vector_storage_dtype: float32
    inference_dtype: bfloat16
    device: cuda
    max_input_tokens: 2048
    query_prompt_name: query
    query_prompt_version: qwen3_query_v1
    tokenizer_padding_side: left
    batch_size: 16

parsing: {backend: native, detect_scanned_pdf: true}

vector_store:
  provider: chroma
  collection: "yp_qwen4b_gpu"
  distance: cosine
  persist_path: "local_data/yp_qwen4b_gpu/chroma"

lexical_store:
  path: "local_data/yp_qwen4b_gpu/manifest.sqlite3"

chunking:
  target_tokens: 500
  max_tokens: 2048
  overlap_tokens: 0
  table_rows_per_chunk: 20

retrieval:
  top_k: 8
  candidates_per_channel: 16
  fusion: {method: rrf, k: 60}
  per_file_cap: 3
  max_source_chars: 6000
  rerank:
    enabled: true
    model: "BAAI/bge-reranker-v2-m3"
    revision: "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"
    device: cuda
    top_n: 12
    batch_size: 16
    max_length: 512
  abstention:
    enabled: true
    signal: rerank_score
    min_top_score: 0.26
    suppress_on_insufficient: false   # DEMO: hand passages + verdict to the LLM; it decides (F20)
  context_expansion:
    enabled: true                     # parent-section context for the answerer (Task A)
    max_chars: 4000

security: {max_query_chars: 2000, max_result_excerpt_chars: 4000}

classification:
  reference_prefixes: ["Youth Participation Resources/"]
