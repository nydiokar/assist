# Offline CI (v3 build plan S0.4): lint, format, and the unit/integration/evaluation tiers on the
# synthetic fixture corpus only. No real corpus, no `live` markers, no network model servers.
name: ci

on:
  push:
    branches: [main, "v3/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          python-version: "3.12"
      - name: Sync (frozen lock, dev extra)
        run: uv sync --frozen --extra dev
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Layer rules (import-linter)
        run: uv run --frozen lint-imports
      - name: Types (pyright strict packages)
        # Only the strict layers: adapters import dev-gpu libraries CI does not install.
        run: >-
          uv run --frozen pyright src/project_rag/domain src/project_rag/core src/project_rag/ports
          src/project_rag/services src/project_rag/wiring.py
      - name: Tests (offline)
        run: uv run --frozen pytest tests/unit tests/contracts tests/integration tests/evaluation -m "not live"

  ocr-tools:
    # OCR/antiword adapter tests against the real binaries, in the assist image's Debian base
    # (same tesseract/ocrmypdf/antiword packages as deploy/Dockerfile).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: python:3.12-slim-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: OCR tools
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -o Acquire::Retries=5 update -q
          apt-get -o Acquire::Retries=5 install -y -q --no-install-recommends             tesseract-ocr tesseract-ocr-bul tesseract-ocr-eng ocrmypdf ghostscript antiword
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      - name: Sync (frozen lock, dev extra)
        run: uv sync --frozen --extra dev
      - name: OCR adapter tests
        run: uv run --frozen pytest tests/integration/test_ocr_tools.py -rs
